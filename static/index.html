<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #e3e5e9;
    --brand: #2563eb; --brand-weak: #eaf1ff;
    --text: #1f2328; --muted: #8a919c;
    --user: #2563eb; --user-text: #ffffff;
    --ok: #16a34a; --warn: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--border);
           padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  header .logo { font-weight: 600; font-size: 16px; }
  header .spacer { flex: 1; }
  header input { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
                 font-size: 13px; width: 200px; }
  header button { border: 1px solid var(--border); background: #fff; border-radius: 6px;
                  padding: 6px 12px; cursor: pointer; font-size: 13px; }
  header button:hover { background: var(--brand-weak); }

  #chat { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 76%; padding: 10px 14px; border-radius: 12px; line-height: 1.55;
            white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .row.user .bubble { background: var(--user); color: var(--user-text);
                      border-bottom-right-radius: 4px; }
  .row.assistant .bubble { background: var(--panel); border: 1px solid var(--border);
                           border-bottom-left-radius: 4px; }
  .bubble .cursor { display: inline-block; width: 7px; height: 14px; background: var(--brand);
                    vertical-align: middle; margin-left: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .src { color: var(--muted); font-size: 12px; margin-top: 6px; border-top: 1px dashed var(--border);
         padding-top: 6px; }
  .actions { margin-top: 6px; display: flex; gap: 8px; align-items: center; }
  .actions button { border: none; background: none; cursor: pointer; font-size: 14px; color: var(--muted);
                    padding: 2px 6px; border-radius: 4px; }
  .actions button:hover { background: var(--bg); color: var(--text); }
  .actions button.on-up { color: var(--ok); }
  .actions button.on-down { color: var(--warn); }

  footer { background: var(--panel); border-top: 1px solid var(--border); padding: 12px 16px;
           display: flex; gap: 10px; align-items: center; }
  footer textarea { flex: 1; border: 1px solid var(--border); border-radius: 8px; resize: none;
                    padding: 10px 12px; font-size: 14px; font-family: inherit; height: 44px; }
  footer textarea:focus { outline: none; border-color: var(--brand); }
  footer button { border: none; border-radius: 8px; padding: 0 18px; cursor: pointer;
                  font-size: 14px; height: 44px; }
  #send { background: var(--brand); color: #fff; }
  #transfer { background: var(--brand-weak); color: var(--brand); }
  #send:disabled, #transfer:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <div class="logo">🤖 智能客服</div>
  <div class="spacer"></div>
  <input id="apikey" type="password" placeholder="X-API-Key（可留空=开发模式）">
  <button id="clear">清空会话</button>
</header>

<main id="chat"></main>

<footer>
  <textarea id="input" placeholder="输入你的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="transfer" title="转人工客服">转人工</button>
  <button id="send">发送</button>
</footer>

<script>
(function () {
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendEl = document.getElementById('send');
  const transferEl = document.getElementById('transfer');
  const clearEl = document.getElementById('clear');
  const apikeyEl = document.getElementById('apikey');

  // 每个浏览器标签一个会话（刷新保持）
  let sessionId = sessionStorage.getItem('cs_sid') || ('s' + Math.random().toString(36).slice(2, 10));
  sessionStorage.setItem('cs_sid', sessionId);
  apikeyEl.value = localStorage.getItem('cs_apikey') || '';
  apikeyEl.addEventListener('change', () => localStorage.setItem('cs_apikey', apikeyEl.value.trim()));

  function apiHeaders() {
    const h = { 'Content-Type': 'application/json' };
    const k = apikeyEl.value.trim();
    if (k) h['X-API-Key'] = k;
    return h;
  }

  function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

  function addRow(role) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    row.appendChild(bubble);
    chatEl.appendChild(row);
    scrollBottom();
    return { row, bubble };
  }

  // 答案里可能附「来源/参考」，抽出渲染为可点击复制的引用块（简单文本级处理）
  function renderAnswer(bubble, text) {
    const lines = text.split('\n');
    const srcLines = [];
    const mainLines = [];
    for (const line of lines) {
      if (/来源|参考|依据|《.*》/.test(line) && line.length < 60) srcLines.push(line);
      else mainLines.push(line);
    }
    bubble.textContent = mainLines.join('\n');
    if (srcLines.length) {
      const src = document.createElement('div');
      src.className = 'src';
      src.textContent = '📎 ' + srcLines.join('\n');
      src.title = '点击复制';
      src.style.cursor = 'pointer';
      src.addEventListener('click', () => navigator.clipboard && navigator.clipboard.writeText(srcLines.join('\n')));
      bubble.appendChild(src);
    }
  }

  function addActions(bubble) {
    const wrap = document.createElement('div');
    wrap.className = 'actions';
    const up = document.createElement('button');
    up.textContent = '👍'; up.title = '有帮助';
    const down = document.createElement('button');
    down.textContent = '👎'; down.title = '没帮助';
    function rate(rating, btn, other) {
      if (btn.classList.contains('on-' + rating)) { btn.classList.remove('on-' + rating); return; }
      btn.classList.add('on-' + rating);
      other.classList.remove('on-up', 'on-down');
      fetch('/feedback', { method: 'POST', headers: apiHeaders(),
        body: JSON.stringify({ rating, session_id: sessionId }) }).catch(() => {});
    }
    up.addEventListener('click', () => rate('up', up, down));
    down.addEventListener('click', () => rate('down', down, up));
    wrap.appendChild(up); wrap.appendChild(down);
    bubble.appendChild(wrap);
  }

  async function send(text) {
    const t = (text || '').trim();
    if (!t) return;
    inputEl.value = '';
    addRow('user').bubble.textContent = t;

    const { bubble } = addRow('assistant');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    bubble.appendChild(cursor);

    setBusy(true);
    let full = '';
    let lastId = 0;
    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify({ message: t, session_id: sessionId, stream: true }),
      });
      if (!resp.ok) {
        throw new Error('HTTP ' + resp.status);
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) !== -1) {
          const chunk = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          for (const line of chunk.split('\n')) {
            if (line.startsWith('id: ')) lastId = parseInt(line.slice(4), 10) || 0;
            if (line.startsWith('data: ')) {
              let payload;
              try { payload = JSON.parse(line.slice(6)); } catch (e) { continue; }
              if (payload.delta) { full += payload.delta; }
              if (payload.done) { renderAnswer(bubble, full); return; }
            }
          }
          if (!full) bubble.textContent = '';
          bubble.textContent = full;
          bubble.appendChild(cursor);
          scrollBottom();
        }
      }
      renderAnswer(bubble, full);
    } catch (e) {
      bubble.textContent = '请求失败：' + e.message + '（请检查 API Key 与服务是否启动）';
    } finally {
      cursor.remove();
      if (full) addActions(bubble);
      setBusy(false);
      scrollBottom();
    }
  }

  function setBusy(b) {
    sendEl.disabled = b;
    transferEl.disabled = b;
  }

  sendEl.addEventListener('click', () => send(inputEl.value));
  transferEl.addEventListener('click', () => send('我要转人工，请帮我转接人工客服'));
  clearEl.addEventListener('click', () => {
    sessionId = 's' + Math.random().toString(36).slice(2, 10);
    sessionStorage.setItem('cs_sid', sessionId);
    chatEl.innerHTML = '';
  });
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(inputEl.value); }
  });
})();
</script>
</body>
</html>
